name: tests

on:
    push:
        branches:
            - main
    pull_request:

permissions:
    contents: read

jobs:
    ci:
        runs-on: ubuntu-latest

        # PostgreSQL is the documented path and SQLite is what `composer setup` gives a
        # contributor with no database installed, so both run on every push.
        strategy:
            fail-fast: false
            matrix:
                database: [sqlite, pgsql]

        name: ci (${{ matrix.database }})

        services:
            postgres:
                image: postgres:18
                env:
                    POSTGRES_DB: saas_foundation
                    POSTGRES_USER: saas_foundation
                    POSTGRES_PASSWORD: password
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
              with:
                  php-version: '8.4'
                  extensions: pcntl, pdo_pgsql, pgsql
                  tools: composer:v2
                  coverage: none

            # Pest Browser invokes Playwright's Node shebang directly, even though Bun
            # owns dependency installation and package scripts.
            - name: Setup Node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: '22'

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

            - name: Setup Application
              run: composer setup

            # The committed suite needs a real browser and a refresh, which will not run
            # inside a transaction; the browser job's `:memory:` schema does not survive
            # the reconnect truncation needs.
            - name: Install Chromium
              run: bunx playwright install --with-deps chromium

            # phpunit.xml declares DB_CONNECTION without force="true", so a real
            # environment variable wins. That is what switches the suite onto Postgres
            # here without editing the committed test configuration.
            - name: Run CI Checks
              run: |
                  php artisan migrate --force
                  composer ci:check
              env:
                  DB_CONNECTION: ${{ matrix.database }}
                  DB_HOST: 127.0.0.1
                  DB_PORT: 5432
                  DB_DATABASE: ${{ matrix.database == 'pgsql' && 'saas_foundation' || format('{0}/database/database.sqlite', github.workspace) }}
                  DB_USERNAME: saas_foundation
                  DB_PASSWORD: password
                  QUEUE_CONNECTION: sync
                  MAIL_MAILER: array

    browser:
        runs-on: ubuntu-latest

        name: browser (sqlite)

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
              with:
                  php-version: '8.4'
                  tools: composer:v2
                  coverage: none

            # Pest Browser invokes Playwright's Node shebang directly, even though Bun
            # owns dependency installation and package scripts.
            - name: Setup Node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: '22'

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

            - name: Setup Application
              run: composer setup

            - name: Install Chromium
              run: bunx playwright install --with-deps chromium

            - name: Run Browser Tests
              run: composer test:browser

    # What a stranger runs: the Laravel installer's GitHub path downloads this commit
    # and runs the post-create-project hook in composer.json. A pull request from a fork
    # installs the fork's commit, which upstream does not have. The installer downloads
    # GitHub's public archive, so the job waits until the repository is public.
    install:
        if: ${{ !github.event.repository.private }}
        runs-on: ubuntu-latest

        name: install with the Laravel installer

        steps:
            - name: Setup PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
              with:
                  php-version: '8.4'
                  tools: composer:v2
                  coverage: none

            # The installer downloads the repository with `npx tiged`, and builds the
            # frontend with Bun when asked to.
            - name: Setup Node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: '22'

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

            - name: Install the Laravel Installer
              run: |
                  composer global require laravel/installer --no-interaction
                  composer global config bin-dir --absolute >> "$GITHUB_PATH"

            - name: Install the Application
              run: laravel new demo-app --using="https://github.com/${REPOSITORY}#${REF}" --bun --no-interaction
              env:
                  REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
                  REF: ${{ github.event.pull_request.head.sha || github.sha }}

            - name: Seed the Demo
              working-directory: demo-app
              run: php artisan saas:demo

            - name: Install Chromium
              working-directory: demo-app
              run: bunx playwright install --with-deps chromium

            - name: Walk the Journey
              working-directory: demo-app
              run: vendor/bin/pest tests/Committed/JourneyTest.php
              env:
                  DB_CONNECTION: sqlite
                  DB_DATABASE: ${{ format('{0}/demo-app/database/database.sqlite', github.workspace) }}

    # The admin console must be removable without a failing test or a dead link.
    # Remove it the way an adopter would, then run the whole gate: the build fails
    # on a leftover console route import, and the smoke test clicks every link.
    admin-removed:
        runs-on: ubuntu-latest

        name: admin console removed (sqlite)

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
              with:
                  php-version: '8.4'
                  tools: composer:v2
                  coverage: none

            - name: Setup Node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: '22'

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

            - name: Setup Application
              run: composer setup

            - name: Remove the Admin Console
              run: php scripts/remove-admin-console.php

            # Wayfinder's output is generated and gitignored, so the routes the
            # console registered are still in it until it is regenerated.
            - name: Rebuild the Frontend
              run: |
                  rm -rf resources/js/actions resources/js/routes
                  php artisan wayfinder:generate --with-form
                  bun run build

            - name: Install Chromium
              run: bunx playwright install --with-deps chromium

            - name: Run CI Checks
              run: |
                  php artisan migrate --force
                  composer ci:check
              env:
                  DB_CONNECTION: sqlite
                  DB_DATABASE: ${{ format('{0}/database/database.sqlite', github.workspace) }}
                  QUEUE_CONNECTION: sync
                  MAIL_MAILER: array

            - name: Run Browser Tests
              run: composer test:browser
